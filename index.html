<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    /* Picnic-in-the-park: vibrant, fun, with icy blue */
    --fern:      #2A7E32;  /* primary — vibrant green */
    --fern-2:    #3D9A40;  /* primary-container — vibrant */
    --moss:      #6B8C2F;  /* secondary moss */
    --paper:     #FFFFFF;  /* surface */
    --paper-2:   #FFF8E8;  /* warm picnic-cloth tone */
    --aspen:     #A6E1FB;  /* sky highlight */
    --aspen-soft:#D6F0FD;  /* softer sky */
    --aspen-2:   #5FBEE3;  /* deeper sky */
    --aspen-deep:#0B5A6F;
    --icy:       #BEEAF6;  /* icy blue — vibrant chill */
    --icy-2:     #7CD3EE;  /* mid icy */
    --icy-deep:  #2596C7;  /* deep icy for type/accents */
    --tertiary:  #00333E;
    --clay:      #C26B3C;  /* warmer brighter clay */
    --berry:     #D94F70;  /* punchy berry */
    --sunshine:  #F2B544;  /* sunshine yellow */
    --ink:       #1A1C1C;
    --muted:     #434841;
    --surface:   #FFFFFF;
    --border:    rgba(42,126,50,0.14);
    --sky-tint:  rgba(166,225,251,0.95);
    --sky-wash:  rgba(166,225,251,0.55);
    --sky-chip:  #A6E1FB;
    --sky-ring:  rgba(95,190,227,0.40);
    --gingham:   #D94F70;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-weight: 400;
    color: var(--ink);
    /* Picnic background — supplied photograph of a fringed blanket on a clover lawn. */
    background-color: #4A7A3A;
    background-image: url("assets/picnic-bg.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  button, input, textarea { font-family: inherit; }

  .display {
    font-family: 'Newsreader', 'Times New Roman', serif;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-feature-settings: "liga", "calt";
  }

  .playful {
    font-family: 'Newsreader', 'Times New Roman', serif;
    font-weight: 500;
    letter-spacing: -0.015em;
    font-style: italic;
  }

  .eyebrow {
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Animations — restrained */
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0) } 40% { transform: translateY(-4px) } }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideUp { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes popIn {
    0% { transform: scale(0.5) translateY(20px); opacity: 0; }
    60% { transform: scale(1.1) translateY(-2px); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes badgePop {
    0%   { transform: scale(0.6) translateY(20px) rotate(-12deg); opacity: 0; }
    50%  { transform: scale(1.12) translateY(-6px) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) translateY(0) rotate(0); opacity: 1; }
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1 }
    100% { transform: translateY(900px) rotate(720deg); opacity: 0 }
  }
  @keyframes ribbonFall {
    0%   { transform: translateY(-40px) rotate(0deg) scaleY(1); opacity: 0 }
    8%   { opacity: 1 }
    50%  { transform: translateY(420px) rotate(180deg) scaleY(0.92); opacity: 1 }
    100% { transform: translateY(950px) rotate(420deg) scaleY(0.6); opacity: 0 }
  }
  @keyframes ribbonWave {
    0%   { transform: translateY(-40px) scaleY(0); opacity: 0 }
    20%  { opacity: 1; transform: translateY(0) scaleY(1) }
    100% { transform: translateY(900px) scaleY(0.6) rotate(40deg); opacity: 0 }
  }
  @keyframes fireworkBurst {
    0%   { transform: scale(0); opacity: 1 }
    70%  { opacity: 1 }
    100% { transform: scale(6); opacity: 0 }
  }
  @keyframes shineSweep {
    0%   { transform: translateX(-120%) rotate(20deg); opacity: 0 }
    35%  { opacity: 0.7 }
    100% { transform: translateX(220%) rotate(20deg); opacity: 0 }
  }
  @keyframes shimmer {
    0%, 100% { filter: brightness(1) saturate(1); }
    50% { filter: brightness(1.18) saturate(1.15); }
  }
  @keyframes badgeFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  /* Scrollbars */
  *::-webkit-scrollbar { width: 4px; height: 4px; }
  *::-webkit-scrollbar-thumb { background: rgba(47,75,48,0.20); border-radius: 2px; }
  *::-webkit-scrollbar-track { background: transparent; }

  /* Shared brand mark — extracted linework from the Beside logo */
  .beside-mark { display: inline-block; vertical-align: middle; }
  .beside-mark .stem { stroke: var(--fern); stroke-linecap: round; fill: none; }
  .beside-mark .bowl { stroke: var(--fern); fill: none; }
  .beside-mark .sun  { fill: #E5B82E; }
  .beside-mark .leaf { fill: #3D9A40; }

  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; background: transparent; cursor: grab; }
  input[type="range"]::-moz-range-thumb { width: 28px; height: 28px; background: transparent; border: none; cursor: grab; }
  input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }

  /* Sky-blue focus ring on inputs — per Verdant Harvest spec */
  input[type="text"]:focus, input[type="email"]:focus, input[type="search"]:focus,
  input[type="number"]:focus, input[type="tel"]:focus, input[type="url"]:focus,
  input[type="password"]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--aspen-2) !important;
    box-shadow: 0 0 0 4px var(--sky-ring);
  }
</style>
